<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#F5F3FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#4ADE80" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#4ADE80" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- Glow aura -->
  <circle cx="512" cy="460" r="380" fill="url(#glow)"/>

  <!-- Inner circle -->
  <circle cx="512" cy="440" r="180" fill="#4ADE80" opacity="0.12"/>

  <!-- Arc / aura shape (top) -->
  <path d="M300 380 Q350 160 512 140 Q674 160 724 380" fill="none" stroke="#4ADE80" stroke-width="18" stroke-linecap="round"/>

  <!-- Arc lower -->
  <path d="M340 520 Q400 680 512 700 Q624 680 684 520" fill="none" stroke="#4ADE80" stroke-width="16" stroke-linecap="round"/>

  <!-- Accent arc -->
  <path d="M380 620 Q460 760 512 780 Q564 760 644 620" fill="none" stroke="#A855F7" stroke-width="12" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="512" cy="440" r="32" fill="#4ADE80"/>

  <!-- Small dots (like particles) -->
  <circle cx="320" cy="360" r="12" fill="#4ADE80" opacity="0.6"/>
  <circle cx="700" cy="350" r="10" fill="#A855F7" opacity="0.5"/>
  <circle cx="360" cy="600" r="8" fill="#4ADE80" opacity="0.4"/>
  <circle cx="670" cy="580" r="10" fill="#A855F7" opacity="0.5"/>
  <circle cx="280" cy="480" r="6" fill="#4ADE80" opacity="0.3"/>
  <circle cx="740" cy="500" r="7" fill="#A855F7" opacity="0.3"/>
</svg>
