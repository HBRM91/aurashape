name: Deploy Aurashape Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_POSTHOG_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_KEY }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
      EXPO_PUBLIC_UNSPLASH_ACCESS_KEY: ${{ secrets.EXPO_PUBLIC_UNSPLASH_ACCESS_KEY }}
      EXPO_PUBLIC_WEB_AUTH_REDIRECT_URL: ${{ vars.EXPO_PUBLIC_WEB_AUTH_REDIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run assert:secrets
      - run: npm run check
      - run: npm run build:web
      - run: npm run assert:local-privacy
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npx wrangler@4.98.0 pages deploy dist --project-name aurashape --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
